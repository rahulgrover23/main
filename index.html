<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rahul Grover</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #0d0221;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow-x: hidden;
    cursor: default;
  }

  .bg {
    position: fixed;
    inset: 0;
    z-index: -2;
    background: linear-gradient(-45deg, #ff0080, #7928ca, #2af598, #009efd, #ff6a00, #ff0080);
    background-size: 400% 400%;
    animation: gradientShift 12s ease infinite;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .stars {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
  }

  .star {
    position: absolute;
    border-radius: 50%;
    background: white;
    opacity: 0.8;
    animation: twinkle 2.5s infinite ease-in-out, floaty 8s infinite ease-in-out;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }
  @keyframes floaty {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-30px); }
    100% { transform: translateY(0px); }
  }

  .container {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px 100px;
    box-sizing: border-box;
  }

  h1 {
    font-size: clamp(1.8rem, 6.5vw, 4.5rem);
    margin: 0;
    font-weight: 900;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #ff0000, #ff9900, #33ff00, #00fffb, #0066ff, #cc00ff, #ff0000);
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: rainbowMove 4s linear infinite, popIn 1s ease-out;
    text-shadow: 0 0 30px rgba(255,255,255,0.25);
    cursor: pointer;
    user-select: none;
    transition: transform 0.15s ease;
  }

  h1:active { transform: scale(0.95); }

  @keyframes rainbowMove {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  @keyframes popIn {
    0% { transform: scale(0) rotate(-10deg); opacity: 0; }
    70% { transform: scale(1.1) rotate(2deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); }
  }

  .hint {
    margin-top: 10px;
    font-size: 0.9rem;
    color: rgba(255,255,255,0.7);
    opacity: 0;
    animation: fadeUp 1s ease-out 0.8s forwards;
  }

  .subtitle {
    margin-top: 16px;
    font-size: clamp(1rem, 2.5vw, 1.4rem);
    color: #fff;
    opacity: 0;
    animation: fadeUp 1.5s ease-out 1s forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .btn-row {
    margin-top: 30px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: center;
    opacity: 0;
    animation: fadeUp 1.5s ease-out 1.4s forwards;
  }

  .fun-btn {
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.5);
    color: white;
    padding: 12px 22px;
    border-radius: 40px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: transform 0.15s ease, background 0.2s ease;
  }

  .fun-btn:hover {
    background: rgba(255,255,255,0.3);
    transform: translateY(-3px) scale(1.05);
  }

  .fun-btn:active {
    transform: scale(0.92);
  }

  #joke-box {
    margin-top: 25px;
    max-width: 500px;
    font-size: 1.1rem;
    color: #fff;
    background: rgba(0,0,0,0.35);
    border-radius: 16px;
    padding: 0;
    max-height: 0;
    overflow: hidden;
    transition: all 0.4s ease;
    opacity: 0;
  }

  #joke-box.show {
    padding: 18px 24px;
    max-height: 200px;
    opacity: 1;
  }

  #counter {
    margin-top: 18px;
    font-size: 0.95rem;
    color: rgba(255,255,255,0.85);
    opacity: 0;
    animation: fadeUp 1.5s ease-out 1.6s forwards;
  }

  .party-mode h1, .party-mode .bg {
    animation-duration: 0.6s !important;
  }

  .balloon {
    position: fixed;
    bottom: -80px;
    font-size: 2.5rem;
    pointer-events: none;
    animation: riseUp 3.5s ease-in forwards;
    z-index: 5;
  }

  @keyframes riseUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-110vh) rotate(20deg); opacity: 0; }
  }

  .confetti {
    position: fixed;
    top: -10px;
    width: 10px;
    height: 10px;
    opacity: 0.9;
    z-index: 5;
    animation: fall linear forwards;
    pointer-events: none;
  }

  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(720deg); }
  }

  /* Tic Tac Toe */
  .game-section {
    margin-top: 50px;
    opacity: 0;
    animation: fadeUp 1.5s ease-out 1.8s forwards;
    background: rgba(0,0,0,0.3);
    border-radius: 20px;
    padding: 24px 28px 30px;
    backdrop-filter: blur(4px);
  }

  .game-title {
    color: #fff;
    font-size: 1.4rem;
    font-weight: 700;
    margin: 0 0 4px;
  }

  .game-sub {
    color: rgba(255,255,255,0.75);
    font-size: 0.9rem;
    margin: 0 0 16px;
  }

  #board {
    display: grid;
    grid-template-columns: repeat(3, 80px);
    grid-template-rows: repeat(3, 80px);
    gap: 8px;
    justify-content: center;
    margin: 0 auto 16px;
  }

  .cell {
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.4);
    border-radius: 12px;
    font-size: 2.4rem;
    font-weight: 900;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease;
    user-select: none;
  }

  .cell:hover {
    background: rgba(255,255,255,0.28);
    transform: scale(1.05);
  }

  .cell.taken {
    cursor: default;
  }

  .cell.taken:hover {
    transform: none;
  }

  .cell.win {
    animation: winPulse 0.6s ease-in-out infinite alternate;
  }

  @keyframes winPulse {
    from { background: rgba(255,255,255,0.2); }
    to { background: rgba(255,255,255,0.5); }
  }

  #status {
    color: #fff;
    font-size: 1.1rem;
    font-weight: 600;
    min-height: 28px;
    margin-bottom: 10px;
  }

  .footer-note {
    position: absolute;
    bottom: 14px;
    font-size: 0.8rem;
    color: rgba(255,255,255,0.6);
  }
</style>
</head>
<body>

<div class="bg" id="bg"></div>
<div class="stars" id="stars"></div>

<div class="container">
  <h1 id="title">Welcome to Rahul Grover Website</h1>
  <div class="hint">psst... click the title 👆</div>
  <div class="subtitle">Glad to have you here ✨</div>

  <div class="btn-row">
    <button class="fun-btn" onclick="tellJoke()">😂 Tell me a joke</button>
    <button class="fun-btn" onclick="launchConfetti()">🎉 Confetti!</button>
    <button class="fun-btn" onclick="launchBalloons()">🎈 Balloons</button>
    <button class="fun-btn" onclick="partyMode()">🕺 Party mode</button>
  </div>

  <div id="joke-box"></div>
  <div id="counter">Title clicked <span id="clickCount">0</span> times</div>

  <div class="game-section">
    <p class="game-title">❌⭕ Ones and Crosses</p>
    <p class="game-sub">You're ❌. The computer (who thinks it's very clever) is ⭕.</p>
    <div id="status">Your move!</div>
    <div id="board"></div>
    <button class="fun-btn" onclick="resetGame()">🔄 New game</button>
  </div>
</div>

<div class="footer-note">made with 💜 by Rahul Grover — click around, it's more fun than it looks</div>

<script>
  // stars
  const starsWrap = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 3 + 1;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDuration = (Math.random() * 3 + 2) + 's, ' + (Math.random() * 6 + 4) + 's';
    s.style.animationDelay = (Math.random() * 3) + 's';
    starsWrap.appendChild(s);
  }

  const colors = ['#ff0080', '#7928ca', '#2af598', '#009efd', '#ff6a00', '#ffee00', '#ff3d3d'];

  function launchConfetti() {
    for (let i = 0; i < 60; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      c.style.animationDuration = (Math.random() * 2 + 2.5) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 5000);
    }
  }

  function launchBalloons() {
    const emojis = ['🎈', '🎈', '🎈', '🎉', '⭐'];
    for (let i = 0; i < 12; i++) {
      const b = document.createElement('div');
      b.className = 'balloon';
      b.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      b.style.left = Math.random() * 90 + 'vw';
      b.style.animationDelay = (Math.random() * 1.2) + 's';
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 4500);
    }
  }

  const jokes = [
    "Why do programmers prefer dark mode? Because light attracts bugs.",
    "I told my computer I needed a break, and now it won't stop sending me KitKats.",
    "Why did Rahul's website cross the road? To get to the other tab.",
    "There are 10 kinds of people: those who understand binary and those who don't.",
    "I'm not lazy, I'm just on energy-saving mode.",
    "Why do Java developers wear glasses? Because they can't C#.",
    "My code doesn't work, I have no idea why. My code works, I have no idea why."
  ];

  function tellJoke() {
    const box = document.getElementById('joke-box');
    box.textContent = jokes[Math.floor(Math.random() * jokes.length)];
    box.classList.add('show');
  }

  let clicks = 0;
  const title = document.getElementById('title');
  const clickMessages = ["Nice click! 👍", "Again? Bold. 😄", "Ok you really like clicking 😂", "At this point we're friends 🤝", "Achievement unlocked: professional clicker 🏆"];

  title.addEventListener('click', () => {
    clicks++;
    document.getElementById('clickCount').textContent = clicks;
    launchConfetti();
    title.style.transform = 'scale(1.1) rotate(' + (Math.random() * 10 - 5) + 'deg)';
    setTimeout(() => title.style.transform = '', 200);
    if (clicks % 5 === 0) {
      const box = document.getElementById('joke-box');
      box.textContent = clickMessages[Math.min(Math.floor(clicks / 5) - 1, clickMessages.length - 1)];
      box.classList.add('show');
    }
  });

  let partyOn = false;
  function partyMode() {
    partyOn = !partyOn;
    document.body.classList.toggle('party-mode', partyOn);
    if (partyOn) {
      launchConfetti();
      launchBalloons();
    }
  }

  // ---------- Tic Tac Toe ----------
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  let board = Array(9).fill(null);
  let gameOver = false;

  const winLines = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  const trashTalk = [
    "Ha! Beep boop, I win. 🤖",
    "Was that even a strategy? 😏",
    "Computers: 1, Humans: 0. As predicted.",
    "I calculated 8 million moves ahead. You clicked randomly."
  ];
  const loseTalk = [
    "Wait what. How did you do that. 😳",
    "Ok fine, you win this one, human.",
    "I demand a rematch! (please)",
    "Beginner's luck. Definitely."
  ];
  const drawTalk = [
    "A draw. Boring, but respectable.",
    "Nobody wins. We're basically friends now.",
    "Tie game! Let's go again."
  ];

  function renderBoard() {
    boardEl.innerHTML = '';
    board.forEach((val, i) => {
      const cell = document.createElement('div');
      cell.className = 'cell' + (val ? ' taken' : '');
      cell.textContent = val === 'X' ? '❌' : val === 'O' ? '⭕' : '';
      cell.addEventListener('click', () => handleMove(i));
      boardEl.appendChild(cell);
    });
  }

  function checkWinner(b) {
    for (const line of winLines) {
      const [a, c, d] = line;
      if (b[a] && b[a] === b[c] && b[a] === b[d]) {
        return { winner: b[a], line };
      }
    }
    if (b.every(v => v)) return { winner: 'draw' };
    return null;
  }

  function handleMove(i) {
    if (gameOver || board[i]) return;
    board[i] = 'X';
    renderBoard();
    const result = checkWinner(board);
    if (result) return endGame(result);

    statusEl.textContent = "Computer is thinking really hard...";
    setTimeout(() => {
      computerMove();
      const result2 = checkWinner(board);
      renderBoard();
      if (result2) return endGame(result2);
      statusEl.textContent = "Your move!";
    }, 500);
  }

  function computerMove() {
    const empty = board.map((v, i) => v === null ? i : null).filter(v => v !== null);
    for (const i of empty) {
      const copy = [...board]; copy[i] = 'O';
      if (checkWinner(copy)?.winner === 'O') { board[i] = 'O'; return; }
    }
    for (const i of empty) {
      const copy = [...board]; copy[i] = 'X';
      if (checkWinner(copy)?.winner === 'X') { board[i] = 'O'; return; }
    }
    if (board[4] === null) { board[4] = 'O'; return; }
    const corners = [0,2,6,8].filter(i => board[i] === null);
    if (corners.length) { board[corners[Math.floor(Math.random()*corners.length)]] = 'O'; return; }
    board[empty[Math.floor(Math.random() * empty.length)]] = 'O';
  }

  function endGame(result) {
    gameOver = true;
    if (result.winner === 'draw') {
      statusEl.textContent = drawTalk[Math.floor(Math.random() * drawTalk.length)];
      launchConfetti();
    } else {
      if (result.line) {
        result.line.forEach(i => boardEl.children[i].classList.add('win'));
      }
      if (result.winner === 'X') {
        statusEl.textContent = "You win! 🎉 " + loseTalk[Math.floor(Math.random() * loseTalk.length)];
        launchConfetti();
        launchBalloons();
      } else {
        statusEl.textContent = trashTalk[Math.floor(Math.random() * trashTalk.length)];
      }
    }
  }

  function resetGame() {
    board = Array(9).fill(null);
    gameOver = false;
    statusEl.textContent = "Your move!";
    renderBoard();
  }

  renderBoard();
</script>

</body>
</html>
