<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rahul Grover — Calculator</title>
<link rel="stylesheet" href="style.css">
<style>
  .calc {
    background: rgba(0,0,0,0.35);
    border-radius: 24px;
    padding: 20px;
    backdrop-filter: blur(6px);
    width: 300px;
    max-width: 90vw;
  }

  #display {
    width: 100%;
    box-sizing: border-box;
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 14px;
    color: #fff;
    font-size: 2rem;
    font-weight: 700;
    text-align: right;
    padding: 16px 14px;
    margin-bottom: 14px;
    overflow-x: auto;
    white-space: nowrap;
  }

  .calc-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  .calc-btn {
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 14px;
    color: #fff;
    font-size: 1.3rem;
    font-weight: 700;
    padding: 16px 0;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.2s ease;
  }

  .calc-btn:hover {
    background: rgba(255,255,255,0.3);
    transform: translateY(-2px) scale(1.05);
  }

  .calc-btn:active {
    transform: scale(0.92);
  }

  .calc-btn.op {
    background: rgba(255,106,0,0.35);
    border-color: rgba(255,106,0,0.6);
  }

  .calc-btn.op:hover {
    background: rgba(255,106,0,0.55);
  }

  .calc-btn.equals {
    background: linear-gradient(90deg, #2af598, #009efd);
    border-color: transparent;
    grid-column: span 2;
  }

  .calc-btn.clear {
    background: rgba(255,0,60,0.35);
    border-color: rgba(255,0,60,0.6);
  }

  .calc-btn.zero {
    grid-column: span 2;
  }

  #calc-msg {
    color: #fff;
    min-height: 24px;
    margin-top: 12px;
    font-size: 0.95rem;
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="stars" id="stars"></div>

<nav class="navbar">
  <a href="index.html">🏠 Home</a>
  <a href="games.html">🎮 Games</a>
  <a href="calculator.html" class="active">🧮 Calculator</a>
</nav>

<div class="container">
  <h1 style="font-size: clamp(1.6rem, 5vw, 3rem);">Calculator 🧮</h1>
  <div class="subtitle">Now with 100% more sass</div>

  <div class="calc" style="margin-top: 24px;">
    <div id="display">0</div>
    <div class="calc-grid">
      <button class="calc-btn clear" onclick="calcClear()">C</button>
      <button class="calc-btn op" onclick="calcBackspace()">⌫</button>
      <button class="calc-btn op" onclick="calcAppend('%')">%</button>
      <button class="calc-btn op" onclick="calcAppend('/')">÷</button>

      <button class="calc-btn" onclick="calcAppend('7')">7</button>
      <button class="calc-btn" onclick="calcAppend('8')">8</button>
      <button class="calc-btn" onclick="calcAppend('9')">9</button>
      <button class="calc-btn op" onclick="calcAppend('*')">×</button>

      <button class="calc-btn" onclick="calcAppend('4')">4</button>
      <button class="calc-btn" onclick="calcAppend('5')">5</button>
      <button class="calc-btn" onclick="calcAppend('6')">6</button>
      <button class="calc-btn op" onclick="calcAppend('-')">−</button>

      <button class="calc-btn" onclick="calcAppend('1')">1</button>
      <button class="calc-btn" onclick="calcAppend('2')">2</button>
      <button class="calc-btn" onclick="calcAppend('3')">3</button>
      <button class="calc-btn op" onclick="calcAppend('+')">+</button>

      <button class="calc-btn zero" onclick="calcAppend('0')">0</button>
      <button class="calc-btn" onclick="calcAppend('.')">.</button>
      <button class="calc-btn equals" onclick="calcEquals()">=</button>
    </div>
    <div id="calc-msg"></div>
  </div>

  <div class="footer-note">made with 💜 by Rahul Grover</div>
</div>

<script src="common.js"></script>
<script>
  const display = document.getElementById('display');
  const msg = document.getElementById('calc-msg');
  let expr = '';
  let justEvaluated = false;

  const sassyLines = [
    "Wow, math. Living dangerously.",
    "I do this in microseconds. You'd take minutes.",
    "Correct! Obviously.",
    "Big number energy.",
    "Nailed it, unlike your mental math."
  ];

  function updateDisplay() {
    display.textContent = expr === '' ? '0' : expr;
  }

  function calcAppend(val) {
    if (justEvaluated) {
      if (!isNaN(val) || val === '.') {
        expr = '';
      }
      justEvaluated = false;
      msg.textContent = '';
    }
    expr += val;
    updateDisplay();
  }

  function calcClear() {
    expr = '';
    justEvaluated = false;
    msg.textContent = '';
    updateDisplay();
  }

  function calcBackspace() {
    expr = expr.slice(0, -1);
    updateDisplay();
  }

  function calcEquals() {
    if (!expr) return;
    try {
      const safe = expr.replace(/[^0-9+\-*/.%() ]/g, '');
      // eslint-disable-next-line no-eval
      const result = Function('"use strict"; return (' + safe + ')')();
      if (result === undefined || isNaN(result) || !isFinite(result)) {
        throw new Error('bad result');
      }
      expr = String(result);
      updateDisplay();
      justEvaluated = true;
      msg.textContent = sassyLines[Math.floor(Math.random() * sassyLines.length)];
      if (Math.random() < 0.15) launchConfetti();
    } catch (e) {
      msg.textContent = "That's not math, that's chaos. Try again. 🙃";
      display.textContent = 'Error';
      expr = '';
      justEvaluated = true;
    }
  }

  document.addEventListener('keydown', (e) => {
    if ((e.key >= '0' && e.key <= '9') || ['+','-','*','/','.','%'].includes(e.key)) {
      calcAppend(e.key);
    } else if (e.key === 'Enter' || e.key === '=') {
      e.preventDefault();
      calcEquals();
    } else if (e.key === 'Backspace') {
      calcBackspace();
    } else if (e.key === 'Escape') {
      calcClear();
    }
  });
</script>

</body>
</html>
