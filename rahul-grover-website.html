<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rahul Grover</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #0d0221;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  .bg {
    position: fixed;
    inset: 0;
    background: linear-gradient(-45deg, #ff0080, #7928ca, #2af598, #009efd, #ff6a00, #ff0080);
    background-size: 400% 400%;
    animation: gradientShift 12s ease infinite;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }

  .star {
    position: absolute;
    border-radius: 50%;
    background: white;
    opacity: 0.8;
    animation: twinkle 2.5s infinite ease-in-out, float 8s infinite ease-in-out;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  @keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-30px); }
    100% { transform: translateY(0px); }
  }

  .container {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  h1 {
    font-size: clamp(2rem, 7vw, 5rem);
    margin: 0;
    font-weight: 900;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #ff0000, #ff9900, #33ff00, #00fffb, #0066ff, #cc00ff, #ff0000);
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: rainbowMove 4s linear infinite, popIn 1s ease-out, bounce 2.5s ease-in-out infinite 1s;
    text-shadow: 0 0 30px rgba(255,255,255,0.25);
  }

  @keyframes rainbowMove {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  @keyframes popIn {
    0% { transform: scale(0) rotate(-10deg); opacity: 0; }
    70% { transform: scale(1.1) rotate(2deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); }
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  .subtitle {
    margin-top: 20px;
    font-size: clamp(1rem, 2.5vw, 1.5rem);
    color: #fff;
    opacity: 0;
    animation: fadeUp 1.5s ease-out 1s forwards;
    letter-spacing: 1px;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .emoji-row {
    margin-top: 30px;
    font-size: 2rem;
    display: flex;
    gap: 20px;
    opacity: 0;
    animation: fadeUp 1.5s ease-out 1.6s forwards;
  }

  .emoji-row span {
    display: inline-block;
    animation: wiggle 1.8s ease-in-out infinite;
  }
  .emoji-row span:nth-child(2) { animation-delay: 0.2s; }
  .emoji-row span:nth-child(3) { animation-delay: 0.4s; }
  .emoji-row span:nth-child(4) { animation-delay: 0.6s; }
  .emoji-row span:nth-child(5) { animation-delay: 0.8s; }

  @keyframes wiggle {
    0%, 100% { transform: rotate(-10deg); }
    50% { transform: rotate(10deg); }
  }

  .confetti {
    position: fixed;
    top: -10px;
    width: 10px;
    height: 10px;
    opacity: 0.9;
    animation: fall linear infinite;
  }

  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(720deg); }
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="stars" id="stars"></div>
<div class="stars" id="confettiWrap"></div>

<div class="container">
  <h1>Welcome to Rahul Grover Website</h1>
  <div class="subtitle">Glad to have you here ✨</div>
  <div class="emoji-row">
    <span>🎉</span><span>🚀</span><span>🌈</span><span>⭐</span><span>🎊</span>
  </div>
</div>

<script>
  const starsWrap = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 3 + 1;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDuration = (Math.random() * 3 + 2) + 's, ' + (Math.random() * 6 + 4) + 's';
    s.style.animationDelay = (Math.random() * 3) + 's';
    starsWrap.appendChild(s);
  }

  const colors = ['#ff0080', '#7928ca', '#2af598', '#009efd', '#ff6a00', '#ffee00', '#ff3d3d'];
  const confettiWrap = document.getElementById('confettiWrap');
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    c.style.animationDuration = (Math.random() * 4 + 4) + 's';
    c.style.animationDelay = (Math.random() * 5) + 's';
    confettiWrap.appendChild(c);
  }
</script>

</body>
</html>
